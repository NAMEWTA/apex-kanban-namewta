name: Release

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm run build

            - name: Package plugin zip
              id: package
              run: |
                  id=$(node -p "require('./manifest.json').id")
                  version=$(node -p "require('./manifest.json').version")
                  rm -rf dist
                  mkdir -p "dist/$id"
                  cp main.js manifest.json styles.css "dist/$id/"
                  zip_name="${id}-${version}.zip"
                  (cd dist && zip -r "../$zip_name" "$id")
                  echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

            - name: Generate build provenance attestation
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: ${{ steps.package.outputs.zip }}

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ${{ steps.package.outputs.zip }}
                      processes/rust-terminal-servers/binaries/*
                  generate_release_notes: true
